server:
  port: 8080

spring:
  application:
    name: shuttershot-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/shuttershot}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  secret: ${JWT_SECRET:change-this-development-only-secret-change-this-development-only-secret}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  upload-dir: ${UPLOAD_DIR:uploads/portfolio}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  mail-from: ${MAIL_FROM:no-reply@shuttershot.local}

textbelt:
  # Free tier: 1 real SMS/day per source IP, shared by everyone using this
  # literal key — good enough to demonstrate real delivery. Set TEXTBELT_API_KEY
  # to a paid key (https://textbelt.com) for higher volume.
  api-key: ${TEXTBELT_API_KEY:textbelt}

gemini:
  # Server-side only — never sent to the frontend. Get a key from
  # https://aistudio.google.com/apikey.
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.6-flash}

aiornot:
  # AI-image detection for admin photo moderation — https://aiornot.com.
  # Server-side only, never sent to the frontend.
  api-key: ${AIORNOT_API_KEY:}

sslcommerz:
  # Sandbox store credentials from https://developer.sslcommerz.com — server-side
  # only, never sent to the frontend. sandbox=false + a live store-id/password
  # switches to the production gateway host with no other code change needed.
  store-id: ${SSLCOMMERZ_STORE_ID:}
  store-password: ${SSLCOMMERZ_STORE_PASSWORD:}
  sandbox: ${SSLCOMMERZ_SANDBOX:true}
