server:
  port: 8080

spring:
  application:
    name: shuttershot-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/shuttershot}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET:change-this-development-only-secret-change-this-development-only-secret}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  upload-dir: ${UPLOAD_DIR:uploads/portfolio}
  base-url: ${APP_BASE_URL:http://localhost:8080}
